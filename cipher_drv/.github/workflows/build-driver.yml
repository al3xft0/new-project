# Build cipher_drv.sys on GitHub Actions (Windows + WDK)
name: Build cipher_drv

on:
  push:
    paths:
      - 'cipher_drv/**'
      - '.github/workflows/build-driver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows Driver Kit (WDK)
        shell: pwsh
        run: |
          # Install WDK matching the runner's Windows SDK
          # Using the NuGet-based approach that works on windows-latest
          $ErrorActionPreference = "Stop"
          Write-Host "Installing WDK components..."
          # windows-latest already has VS + Windows SDK; install WDK extension
          # Fallback: use EWDK style if needed
          choco install windowsdriverkit10 --yes --no-progress
          Write-Host "WDK install step finished"

      - name: Locate WDK / build tools
        shell: pwsh
        run: |
          Write-Host "VS path:"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Build cipher_drv (Release x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proj = "cipher_drv\cipher_drv.vcxproj"
          if (-not (Test-Path $proj)) { $proj = "cipher_drv.vcxproj" }
          msbuild $proj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed" }

      - name: Locate output .sys
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "cipher_drv.sys" | ForEach-Object { Write-Host $_.FullName }

      - name: Upload cipher_drv.sys
        uses: actions/upload-artifact@v4
        with:
          name: cipher_drv-sys
          path: |
            **/cipher_drv.sys
            **/cipher_drv.pdb
          if-no-files-found: warn
