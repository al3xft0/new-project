name: build cipher_ping

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: build cipher_ping
        run: |
          cd cipher_ping
          cl /EHsc /O2 /W3 main.cpp /Fe:cipher_ping.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipher_ping
          path: cipher_ping/cipher_ping.exe
