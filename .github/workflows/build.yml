name: Build Cipher

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Clone Dear ImGui
        shell: pwsh
        run: |
          if (-not (Test-Path "external/imgui/imgui.h")) {
            if (Test-Path "Cipher/external/imgui/imgui.h") {
              # already present under Cipher/
            } else {
              $dest = if (Test-Path "Cipher/CMakeLists.txt") { "Cipher/external/imgui" } else { "external/imgui" }
              git clone --depth 1 https://github.com/ocornut/imgui.git $dest
            }
          }

      - name: Show CMakeLists (debug)
        shell: pwsh
        run: |
          $root = if (Test-Path "CMakeLists.txt") { "." } elseif (Test-Path "Cipher/CMakeLists.txt") { "Cipher" } else { "." }
          Write-Host "ROOT=$root"
          Get-Content "$root/CMakeLists.txt"

      - name: Configure (VS 2022 x64)
        shell: pwsh
        run: |
          $root = if (Test-Path "CMakeLists.txt") { "." } elseif (Test-Path "Cipher/CMakeLists.txt") { "Cipher" } else { "." }
          echo "ROOT=$root" >> $env:GITHUB_ENV
          if (Test-Path "$root/build") { Remove-Item -Recurse -Force "$root/build" }
          cmake -B "$root/build" -S "$root" -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build "$env:ROOT/build" --config Release --parallel

      - name: Stage package
        shell: pwsh
        run: |
          $root = $env:ROOT
          $out = Join-Path $env:GITHUB_WORKSPACE "cipher-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Get-ChildItem -Path "$root/build" -Recurse -Filter "Cipher.exe" | Select-Object -First 1
          if (-not $exe) { throw "Cipher.exe not found" }
          Copy-Item $exe.FullName $out
          $assets = Join-Path $root "assets"
          if (Test-Path $assets) {
            Copy-Item -Recurse -Force $assets (Join-Path $out "assets")
            Copy-Item -Force (Join-Path $assets "*.png") $out -ErrorAction SilentlyContinue
          }
          Get-ChildItem $out -Recurse | Format-Table Name, Length

      - name: Upload Cipher artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cipher-win-x64
          path: cipher-out/
          if-no-files-found: error
          retention-days: 14
